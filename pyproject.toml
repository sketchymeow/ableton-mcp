[project]
name = "ableton-mcp"
version = "0.1.0"
description = "MCP server for controlling Ableton Live"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
ableton-mcp = "ableton_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"remote_script/AbletonMCP" = "ableton_mcp/remote_script/AbletonMCP"

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a running Ableton Live with the AbletonMCP remote script",
]
