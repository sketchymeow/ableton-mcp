# Python here is only the remote script's test harness; the MCP server
# lives in server/ (TypeScript).

[project]
name = "ableton-mcp-bridge-tests"
version = "0.3.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a running Ableton Live with the AbletonMCP remote script",
]
